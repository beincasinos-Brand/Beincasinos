name: Repair ADR guide edge cache and verify production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-adr-edge-cache.yml"

permissions:
  contents: read

concurrency:
  group: repair-adr-edge-cache
  cancel-in-progress: false

jobs:
  purge-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Purge only the affected public URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EDIT_ZONE_DNS: ${{ secrets.EDIT_ZONE_DNS }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = "https://api.cloudflare.com/client/v4"
          target = "https://beincasinos.online/guides/alternative-dispute-resolution-gambling/"
          candidates = []
          for name in ("CLOUDFLARE_API_TOKEN", "EDIT_ZONE_DNS"):
              value = (os.environ.get(name) or "").strip()
              if value and value not in [item[1] for item in candidates]:
                  candidates.append((name, value))
          if not candidates:
              raise SystemExit("No Cloudflare token is available. Add a token in GitHub Actions Secrets; never paste it into chat.")

          failures = []
          for name, token in candidates:
              headers = {
                  "Authorization": "Bearer " + token,
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "User-Agent": "BeInCasinos-targeted-edge-repair",
              }

              def request(path, payload=None):
                  data = None if payload is None else json.dumps(payload).encode()
                  req = urllib.request.Request(base + path, data=data, headers=headers)
                  try:
                      with urllib.request.urlopen(req, timeout=20) as response:
                          return response.status, json.load(response)
                  except urllib.error.HTTPError as exc:
                      # Keep only Cloudflare's error codes/messages; never print headers or credentials.
                      try:
                          body = json.loads(exc.read().decode("utf-8", "replace"))
                          errors = body.get("errors") or []
                          safe_errors = [
                              {
                                  "code": item.get("code"),
                                  "message": str(item.get("message", ""))[:180],
                              }
                              for item in errors[:3]
                          ]
                      except Exception:
                          safe_errors = []
                      return exc.code, {"success": False, "errors": safe_errors}

              verify_status, verify = request("/user/tokens/verify")
              if verify_status != 200 or not verify or not verify.get("success"):
                  failures.append(f"{name}: token verification failed (HTTP {verify_status})")
                  continue

              zone_status, zones = request("/zones?name=beincasinos.online&per_page=1")
              matching = (zones or {}).get("result") or []
              if zone_status != 200 or not zones or not zones.get("success") or not matching:
                  failures.append(f"{name}: zone lookup failed (HTTP {zone_status})")
                  continue

              zone_id = matching[0]["id"]
              purge_status, result = request(f"/zones/{zone_id}/purge_cache", {"files": [target]})
              if purge_status == 200 and result and result.get("success"):
                  purge_id = str((result.get("result") or {}).get("id", "accepted"))
                  print(f"Cloudflare accepted a targeted purge using secret {name}.")
                  print("Only the affected guide URL was requested for purge.")
                  print("Purge request id: " + purge_id)
                  break
              detail = (result or {}).get("errors") or []
              summary = "; ".join(f"Cloudflare {item.get('code', 'unknown')}: {str(item.get('message', 'no message'))[:160]}" for item in detail[:3])
              failures.append(f"{name}: targeted purge rejected (HTTP {purge_status}" + (f"; {summary}" if summary else "; no API error details returned") + ")")
          else:
              print("No available token could purge the single target URL.")
              for failure in failures:
                  print("- " + failure)
              raise SystemExit("Action required: configure a valid token with Zone:Read and Zone:Cache Purge for beincasinos.online.")
          PY

      - name: Verify canonical domain, guide response, sitemap and www redirect
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          target = "https://beincasinos.online/guides/alternative-dispute-resolution-gambling/"
          sitemap = "https://beincasinos.online/sitemap.xml"
          www = "https://www.beincasinos.online/guides/alternative-dispute-resolution-gambling/"
          headers = {"Cache-Control": "no-cache", "Pragma": "no-cache", "User-Agent": "BeInCasinos-production-smoke-test"}

          def fetch(url):
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      return response.status, response.geturl(), response.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.geturl(), exc.read().decode("utf-8", "replace")

          status = 0
          body = ""
          for attempt in range(1, 4):
              status, final_url, body = fetch(target)
              print(f"Guide attempt {attempt}: HTTP {status}; final URL: {final_url}")
              if status == 200:
                  break
              time.sleep(3)
          if status != 200:
              raise SystemExit("The canonical guide URL still does not return HTTP 200 after the targeted purge.")
          if 'rel="canonical" href="' + target + '"' not in body and "rel='canonical' href='" + target + "'" not in body:
              raise SystemExit("Guide returned HTTP 200 but the expected self-canonical was not found.")
          print("Guide canonical check passed.")

          sitemap_status, _, sitemap_body = fetch(sitemap)
          if sitemap_status != 200 or target not in sitemap_body:
              raise SystemExit(f"Sitemap check failed (HTTP {sitemap_status}) or the guide URL is missing.")
          print("Sitemap check passed: affected guide URL is listed.")

          www_status, www_final, _ = fetch(www)
          print(f"www check: HTTP {www_status}; final URL: {www_final}")
          if www_status != 200 or not www_final.startswith("https://beincasinos.online/"):
              raise SystemExit("www did not resolve through to the canonical apex domain.")
          print("All production smoke checks passed.")
          PY
