name: Static site checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check HTML structure and local links
        run: python3 scripts/check_site.py
      - name: Build public-only deployment artifact
        run: python3 scripts/build_site.py
      - name: Verify deployment artifact excludes internal files
        run: python3 scripts/check_deploy_artifact.py
      - name: Store sanitized site artifact for later release
        uses: actions/upload-artifact@v4
        with:
          name: beincasinos-public-site-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
