name: Fetch operator logos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download operator logos
        run: python3 scripts/fetch_logos.py
      - name: Rebuild review pages
        run: python3 scripts/build_tier1.py apply && python3 scripts/build_tier1.py check
      - name: Commit logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brands reviews index.html
          git diff --cached --quiet && echo "No new logos" || (git commit -m "Add operator logos fetched from official sites" && git push)
