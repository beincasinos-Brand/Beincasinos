name: Read-only Cloudflare launch diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-readonly-launch-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public DNS for apex and www
        id: dns
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import urllib.parse
          import urllib.request

          print("## Public DNS")
          for host, record_type in [
              ("beincasinos.online", "A"),
              ("www.beincasinos.online", "A"),
              ("www.beincasinos.online", "CNAME"),
          ]:
              query = urllib.parse.urlencode({"name": host, "type": record_type})
              request = urllib.request.Request(
                  "https://dns.google/resolve?" + query,
                  headers={"Accept": "application/dns-json", "User-Agent": "BeInCasinos-launch-diagnostics"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=10) as response:
                      data = json.load(response)
                  answers = data.get("Answer", [])
                  values = [item.get("data", "") for item in answers]
                  print(f"- `{host}` {record_type}: DNS status {data.get('Status')}; answers: {', '.join(values) if values else 'none'}")
              except Exception as exc:
                  print(f"- `{host}` {record_type}: lookup failed ({type(exc).__name__})")
          PY

      - name: Verify Cloudflare API token without exposing it
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EDIT_ZONE_DNS: ${{ secrets.EDIT_ZONE_DNS }}
        run: |
          set -euo pipefail
          TOKEN="${CLOUDFLARE_API_TOKEN:-${EDIT_ZONE_DNS:-}}"
          if [ -z "$TOKEN" ]; then
            echo "::error::Neither CLOUDFLARE_API_TOKEN nor EDIT_ZONE_DNS is available to this workflow."
            echo "- Cloudflare API token: unavailable to workflow." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          verify_status="$(curl --silent --show-error --output /tmp/cf-verify.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $TOKEN" \
            --header "Accept: application/json" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          zone_status="$(curl --silent --show-error --output /tmp/cf-zone.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $TOKEN" \
            --header "Accept: application/json" \
            'https://api.cloudflare.com/client/v4/zones?name=beincasinos.online&per_page=1')"

          python - "$verify_status" "$zone_status" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import sys

          verify_http, zone_http = sys.argv[1:3]
          with open("/tmp/cf-verify.json", encoding="utf-8") as f:
              verify = json.load(f)
          with open("/tmp/cf-zone.json", encoding="utf-8") as f:
              zones = json.load(f)

          verify_ok = bool(verify.get("success")) and verify_http == "200"
          zone_ok = bool(zones.get("success")) and zone_http == "200"
          zone_count = len(zones.get("result") or []) if zone_ok else 0
          print("## Cloudflare API (read-only)")
          print(f"- Token verification HTTP: {verify_http}; valid: {'yes' if verify_ok else 'no/unknown'}")
          print(f"- Zone lookup HTTP: {zone_http}; query succeeded: {'yes' if zone_ok else 'no'}")
          print(f"- Matching zone found: {'yes' if zone_count else 'no or not readable'}")
          if not verify_ok:
              print("- Action needed: replace the token with a valid token using GitHub Secrets; never paste it into chat.")
          elif not zone_ok:
              print("- Action needed: token may lack permission to read the zone list. Check token scope for this zone.")
          elif not zone_count:
              print("- Action needed: confirm the zone is present in the connected Cloudflare account.")
          PY

          # Fail closed if the token cannot be validated or the zone cannot be read.
          python - <<'PY'
          import json
          with open("/tmp/cf-verify.json", encoding="utf-8") as f:
              verify = json.load(f)
          with open("/tmp/cf-zone.json", encoding="utf-8") as f:
              zones = json.load(f)
          if not verify.get("success") or not zones.get("success") or not (zones.get("result") or []):
              raise SystemExit(1)
          PY

      - name: Inspect Pages deployment state without changing it
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EDIT_ZONE_DNS: ${{ secrets.EDIT_ZONE_DNS }}
        run: |
          set -euo pipefail
          TOKEN="${CLOUDFLARE_API_TOKEN:-${EDIT_ZONE_DNS:-}}"
          export TOKEN
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, urllib.request, urllib.error
          account = "9440004e4a97e4634ba5146c55ceafb2"
          project = "beincasinos"
          headers = {"Authorization": "Bearer " + os.environ["TOKEN"], "Accept": "application/json"}
          base = "https://api.cloudflare.com/client/v4"
          def get(path):
              req = urllib.request.Request(base + path, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      body = json.load(response)
              except urllib.error.HTTPError as exc:
                  print(f"Cloudflare Pages read returned HTTP {exc.code}; deployment state unavailable.")
                  return None
              if not body.get("success"):
                  print("Cloudflare Pages API returned an unsuccessful response; deployment state unavailable.")
                  return None
              return body.get("result")
          print("## Cloudflare Pages deployment (read-only)")
          p = get(f"/accounts/{account}/pages/projects/{project}")
          if p:
              print(f"- Project: {p.get('name', project)}")
              print(f"- Production branch: {p.get('production_branch', 'unknown')}")
              print(f"- Project subdomain: {p.get('subdomain', 'unknown')}")
              print(f"- Git integration: {'configured' if p.get('source') else 'not reported by API'}")
          ds = get(f"/accounts/{account}/pages/projects/{project}/deployments?per_page=3")
          if ds is not None:
              deployments = ds if isinstance(ds, list) else ds.get('result', []) if isinstance(ds, dict) else []
              for i, d in enumerate(deployments[:3], 1):
                  deployment = d.get("deployment_trigger", {}) or {}
                  metadata = d.get("latest_stage", {}) or {}
                  print(f"- Deployment {i}: environment={d.get('environment', 'unknown')}; status={metadata.get('status', d.get('status', 'unknown'))}; commit={deployment.get('metadata', {}).get('commit_hash', 'unknown')}; branch={deployment.get('metadata', {}).get('branch', 'unknown')}")
              if not deployments:
                  print("- No deployments were returned.")
          PY
