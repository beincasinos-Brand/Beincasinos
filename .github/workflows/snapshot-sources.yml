name: Snapshot official sources

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Space-separated review slugs (empty = all in research/sources.json)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch pages
        run: python3 scripts/snapshot_sources.py ${{ github.event.inputs.slugs }}
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/snapshots
          git diff --cached --quiet && echo "No changes" || (git commit -m "Add official source snapshots" && git pull --rebase origin main && git push)
